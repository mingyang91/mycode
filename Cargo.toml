[workspace]
members = [
  "crates/mycode-plugin-protocol",
  "crates/mycode-workspace-plugin",
  "crates/mycode-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream", "osc52"] }
futures-util = "=0.3.34"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
ignore = "=0.4.25"
nix = { version = "=0.30.1", features = ["process", "signal"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "http2", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.12.2"
thiserror = "=2.0.20"
textwrap = "=0.16.2"
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
unicode-width = "=0.2.2"
uuid = { version = "=1.24.1", features = ["v4"] }
